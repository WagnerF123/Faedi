    // Permite que a busca compartilhada reaproveite os dados quando esta página estiver aberta.
    window.FaediNewsDocuments = noticias;

    // Função para obter notícias relacionadas
    function getNoticiasRelacionadas(noticiaAtual, limite = 3) {
      return noticias
        .filter(n => n.id !== noticiaAtual.id && n.categoria === noticiaAtual.categoria)
        .slice(0, limite);
    }

    // Identifica mídias institucionais para evitar recorte da marca.
    function isLogoFaedi(imagePath) {
      return /(?:^|\/)logo-faedi\.png(?:[?#]|$)/i.test(imagePath);
    }

    function isSecondaryBanner(imagePath) {
      return /(?:^|\/)banner-secundario\.png(?:[?#]|$)/i.test(imagePath);
    }

    function getOptimizedContentImagePath(imagePath) {
      return isSecondaryBanner(imagePath)
        ? 'images/optimized/banner-secundario-1920.webp'
        : imagePath;
    }

    function renderResponsiveNewsImage(imagePath, alt, loading = 'lazy', sizes = '100vw') {
      if (isLogoFaedi(imagePath)) {
        return `<img src="${imagePath}" alt="${alt}" width="484" height="181" loading="${loading}" decoding="async">`;
      }

      if (isSecondaryBanner(imagePath)) {
        return `
          <picture>
            <source
              type="image/webp"
              srcset="images/optimized/banner-secundario-768.webp 768w, images/optimized/banner-secundario-1280.webp 1280w, images/optimized/banner-secundario-1920.webp 1920w"
              sizes="${sizes}"
            >
            <img src="${imagePath}" alt="${alt}" width="8000" height="3431" loading="${loading}" decoding="async">
          </picture>
        `;
      }

      return `<img src="${imagePath}" alt="${alt}" loading="${loading}" decoding="async">`;
    }

    function setMetaContent(selector, content) {
      const meta = document.querySelector(selector);

      if (meta && content) {
        meta.setAttribute('content', content);
      }
    }

    function getIsoPublicationDate(displayDate) {
      const monthNames = {
        janeiro: '01',
        fevereiro: '02',
        marco: '03',
        abril: '04',
        maio: '05',
        junho: '06',
        julho: '07',
        agosto: '08',
        setembro: '09',
        outubro: '10',
        novembro: '11',
        dezembro: '12'
      };
      const normalizedDate = displayDate
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('pt-BR');
      const match = normalizedDate.match(/^(\d{1,2}) de ([a-z]+) de (\d{4})$/);

      if (!match || !monthNames[match[2]]) {
        return '';
      }

      return `${match[3]}-${monthNames[match[2]]}-${match[1].padStart(2, '0')}`;
    }

    function removeNewsStructuredData() {
      document.getElementById('news-structured-data')?.remove();
    }

    function updateNewsSeo(noticia) {
      const pageTitle = `${noticia.titulo} | Faculdade FAEDI`;
      const imageUrl = new URL(getOptimizedContentImagePath(noticia.imagem), document.baseURI).href;
      const socialImageUrl = new URL('images/optimized/faedi-social-1200.jpg', document.baseURI).href;
      const imageAlt = isLogoFaedi(noticia.imagem)
        ? 'Marca institucional da Faculdade FAEDI'
        : noticia.titulo;
      const publicationDate = getIsoPublicationDate(noticia.data);
      const pageUrl = window.location.href;

      document.title = pageTitle;
      setMetaContent('meta[name="description"]', noticia.resumo);
      setMetaContent('[data-news-robots]', 'index, follow');
      setMetaContent('[data-news-meta="title"]', pageTitle);
      setMetaContent('[data-news-meta="description"]', noticia.resumo);
      setMetaContent('[data-news-meta="type"]', 'article');
      setMetaContent('[data-news-meta="image"]', socialImageUrl);
      setMetaContent('[data-news-meta="image-alt"]', imageAlt);
      setMetaContent('[data-news-meta="twitter-title"]', pageTitle);
      setMetaContent('[data-news-meta="twitter-description"]', noticia.resumo);
      setMetaContent('[data-news-meta="twitter-image"]', socialImageUrl);
      setMetaContent('[data-news-meta="twitter-image-alt"]', imageAlt);

      const newsArticle = {
        '@type': 'NewsArticle',
        headline: noticia.titulo,
        description: noticia.resumo,
        image: [imageUrl],
        author: {
          '@type': 'Organization',
          name: noticia.autor
        },
        publisher: {
          '@type': 'CollegeOrUniversity',
          name: 'Faculdade FAEDI',
          logo: {
            '@type': 'ImageObject',
            url: new URL('images/logo-faedi.png', document.baseURI).href,
            width: 484,
            height: 181
          }
        },
        mainEntityOfPage: {
          '@type': 'WebPage',
          '@id': pageUrl
        }
      };

      if (publicationDate) {
        newsArticle.datePublished = publicationDate;
      }

      const structuredData = {
        '@context': 'https://schema.org',
        '@graph': [
          newsArticle,
          {
            '@type': 'BreadcrumbList',
            itemListElement: [
              {
                '@type': 'ListItem',
                position: 1,
                name: 'Faculdade FAEDI',
                item: new URL('index.html', document.baseURI).href
              },
              {
                '@type': 'ListItem',
                position: 2,
                name: 'Notícias',
                item: new URL('noticias.html', document.baseURI).href
              },
              {
                '@type': 'ListItem',
                position: 3,
                name: noticia.titulo
              }
            ]
          }
        ]
      };
      const script = document.createElement('script');
      script.id = 'news-structured-data';
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(structuredData);
      removeNewsStructuredData();
      document.head.append(script);
    }

    function updateNewsErrorSeo() {
      const pageTitle = 'Notícia não encontrada | Faculdade FAEDI';
      const description = 'A notícia solicitada não foi encontrada na área de notícias da Faculdade FAEDI.';

      document.title = pageTitle;
      setMetaContent('meta[name="description"]', description);
      setMetaContent('[data-news-robots]', 'noindex, follow');
      setMetaContent('[data-news-meta="title"]', pageTitle);
      setMetaContent('[data-news-meta="description"]', description);
      setMetaContent('[data-news-meta="type"]', 'website');
      setMetaContent('[data-news-meta="twitter-title"]', pageTitle);
      setMetaContent('[data-news-meta="twitter-description"]', description);
      removeNewsStructuredData();
    }

    function renderizarNavegacao(noticiaAnterior, proximaNoticia) {
      const linkAnterior = noticiaAnterior
        ? `
          <a href="noticia.html?id=${noticiaAnterior.id}" class="news-article-nav-link" aria-label="Ler notícia anterior: ${noticiaAnterior.titulo}">
            <i class="fas fa-chevron-left" aria-hidden="true"></i>
            Notícia Anterior
          </a>
        `
        : `
          <span class="news-article-nav-link is-disabled" aria-disabled="true">
            <i class="fas fa-chevron-left" aria-hidden="true"></i>
            Notícia Anterior
          </span>
        `;

      const linkProximo = proximaNoticia
        ? `
          <a href="noticia.html?id=${proximaNoticia.id}" class="news-article-nav-link" aria-label="Ler próxima notícia: ${proximaNoticia.titulo}">
            Próxima Notícia
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
          </a>
        `
        : `
          <span class="news-article-nav-link is-disabled" aria-disabled="true">
            Próxima Notícia
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
          </span>
        `;

      return `
        <nav class="news-article-navigation" aria-label="Navegação entre notícias">
          ${linkAnterior}
          <a href="noticias.html" class="news-article-nav-link" aria-label="Voltar para todas as notícias">
            <i class="fas fa-list" aria-hidden="true"></i>
            Todas as Notícias
          </a>
          ${linkProximo}
        </nav>
      `;
    }

    function renderizarEstadoErro(message) {
      return `
        <section class="news-article-state news-article-state--error" role="alert">
          <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
          <h1>Notícia não encontrada</h1>
          <p>${message}</p>
          <a href="noticias.html" class="news-article-state-link">Voltar para Notícias</a>
        </section>
      `;
    }

    // Função para renderizar a notícia
    function renderizarNoticia(noticia) {
      const relacionadas = getNoticiasRelacionadas(noticia);
      const currentIndex = noticias.findIndex(item => item.id === noticia.id);
      const noticiaAnterior = currentIndex > 0 ? noticias[currentIndex - 1] : null;
      const proximaNoticia = currentIndex < noticias.length - 1 ? noticias[currentIndex + 1] : null;
      const mainMediaType = isLogoFaedi(noticia.imagem) ? 'brand' : 'editorial';
      const mainImageAlt = mainMediaType === 'brand' ? 'Marca institucional da Faculdade FAEDI' : '';

      const html = `
        <article class="news-article">
          <header class="news-article-hero">
            <div class="news-article-hero-shell">
              <h1>${noticia.titulo}</h1>
              <p class="news-article-summary">${noticia.resumo}</p>
              <div class="news-article-meta">
                <div class="news-article-meta-item">
                  <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                  <span class="sr-only">Data:</span>
                  <span>${noticia.data}</span>
                </div>
                <div class="news-article-meta-item">
                  <i class="fas fa-user" aria-hidden="true"></i>
                  <span class="sr-only">Autoria:</span>
                  <span>${noticia.autor}</span>
                </div>
                <div class="news-article-meta-item">
                  <i class="fas fa-tag" aria-hidden="true"></i>
                  <span class="sr-only">Categoria:</span>
                  <span>${noticia.categoria.charAt(0).toUpperCase() + noticia.categoria.slice(1)}</span>
                </div>
              </div>
            </div>
          </header>

          <div class="news-article-content">
            <figure class="news-article-media news-article-media--${mainMediaType}">
              ${renderResponsiveNewsImage(noticia.imagem, mainImageAlt, 'eager', '(max-width: 860px) calc(100vw - 2rem), 840px')}
            </figure>

            <div class="news-article-copy">
              ${noticia.conteudo}
            </div>

            <aside class="news-article-share" aria-labelledby="news-share-title">
              <h2 id="news-share-title">Compartilhar esta notícia</h2>
              <div class="news-article-share-actions">
                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener noreferrer" class="news-share-link news-share-link--facebook" aria-label="Compartilhar esta notícia no Facebook (abre em nova aba)">
                  <i class="fab fa-facebook-f" aria-hidden="true"></i> Facebook
                </a>
                <a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(noticia.titulo)}" target="_blank" rel="noopener noreferrer" class="news-share-link news-share-link--twitter" aria-label="Compartilhar esta notícia no Twitter (abre em nova aba)">
                  <i class="fab fa-twitter" aria-hidden="true"></i> Twitter
                </a>
                <a href="https://wa.me/?text=${encodeURIComponent(noticia.titulo + ' ' + window.location.href)}" target="_blank" rel="noopener noreferrer" class="news-share-link news-share-link--whatsapp" aria-label="Compartilhar esta notícia no WhatsApp (abre em nova aba)">
                  <i class="fab fa-whatsapp" aria-hidden="true"></i> WhatsApp
                </a>
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener noreferrer" class="news-share-link news-share-link--linkedin" aria-label="Compartilhar esta notícia no LinkedIn (abre em nova aba)">
                  <i class="fab fa-linkedin-in" aria-hidden="true"></i> LinkedIn
                </a>
              </div>
            </aside>

            ${renderizarNavegacao(noticiaAnterior, proximaNoticia)}
          </div>

          ${relacionadas.length > 0 ? `
            <section class="news-related" aria-labelledby="news-related-title">
              <div class="news-related-shell">
                <h2 id="news-related-title">Notícias Relacionadas</h2>
                <div class="news-related-grid">
                  ${relacionadas.map(rel => {
                    const relatedMediaType = isLogoFaedi(rel.imagem) ? 'brand' : 'editorial';

                    return `
                      <a href="noticia.html?id=${rel.id}" class="news-related-card">
                        <div class="news-related-media news-related-media--${relatedMediaType}">
                          ${renderResponsiveNewsImage(rel.imagem, '', 'lazy', '(max-width: 560px) calc(100vw - 2rem), 340px')}
                        </div>
                        <div class="news-related-card-content">
                          <h3>${rel.titulo}</h3>
                          <div class="news-related-meta">
                            <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                            <span>${rel.data}</span>
                          </div>
                        </div>
                      </a>
                    `;
                  }).join('')}
                </div>
              </div>
            </section>
          ` : ''}
        </article>
      `;

      return html;
    }

    // Função principal
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawNewsId = urlParams.get('id');
      const isStrictNewsId = rawNewsId !== null
        && /^[1-9]\d*$/.test(rawNewsId)
        && Number.isSafeInteger(Number(rawNewsId));

      if (!isStrictNewsId) {
        updateNewsErrorSeo();
        document.getElementById('noticia-container').innerHTML = renderizarEstadoErro(
          'O ID da notícia não foi especificado ou é inválido.'
        );
        return;
      }

      const noticiaId = Number(rawNewsId);

      const noticia = noticias.find(n => n.id === noticiaId);

      if (!noticia) {
        updateNewsErrorSeo();
        document.getElementById('noticia-container').innerHTML = renderizarEstadoErro(
          'A notícia solicitada não existe ou foi removida.'
        );
        return;
      }

      // Renderizar a notícia
      document.getElementById('noticia-container').innerHTML = renderizarNoticia(noticia);

      // Atualizar metadados da notícia válida.
      updateNewsSeo(noticia);
    });
  </script>
</body>
</html>
